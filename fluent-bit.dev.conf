# Local-dev Fluent Bit config for keep-event-handler.
# Accepts JSON log records over HTTP (what FluentBitHandler POSTs) and echoes
# them to stdout so developers can watch forwarded logs with `docker logs`.
# This is NOT the production collector config (that lives in the OpenShift
# ConfigMap); it exists only to exercise forwarding end-to-end locally.
[SERVICE]
    Flush        1
    Log_Level    info
    Daemon       off
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name         http
    Listen       0.0.0.0
    Port         9880

[OUTPUT]
    Name         stdout
    Match        *
    Format       json_lines
