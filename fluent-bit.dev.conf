# Local-dev Fluent Bit config for keep-event-handler.
# Accepts JSON log records over HTTP (what FluentBitHandler POSTs), echoes them
# to stdout, and indexes them into the local Elasticsearch so they can be
# browsed in Kibana. This is NOT the production collector config (that lives in
# the OpenShift ConfigMap); it exists only to exercise forwarding end-to-end
# locally. Bring the stack up with the `observability` compose profile.
[SERVICE]
    Flush        1
    Log_Level    info
    Daemon       off
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name         http
    Listen       0.0.0.0
    Port         9880

# Echo to the container's stdout: `docker logs <fluent-bit>`.
[OUTPUT]
    Name         stdout
    Match        *
    Format       json_lines

# Index into the local Elasticsearch (service name `elasticsearch`, security off).
# View in Kibana at http://localhost:5601 (Discover -> keep-event-handler-*).
[OUTPUT]
    Name              es
    Match             *
    Host              elasticsearch
    Port              9200
    Index             keep-event-handler
    Suppress_Type_Name On
    Generate_ID       On
    Retry_Limit       False
