version: "3"
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    depends_on:
      - zookeeper
    ports:
      - 29092:29092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 60000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 60000
    healthcheck:
      test: nc -z localhost 9092 || exit 1
      start_period: 20s
      interval: 5s
      retries: 10

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: keep
      POSTGRES_USER: keep
      POSTGRES_PASSWORD: keep
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keep" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  websocket:
    image: quay.io/soketi/soketi:1.4-16-debian
    ports:
      - "6001:6001"
      - "9601:9601"
    environment:
      - SOKETI_USER_AUTHENTICATION_TIMEOUT=3000
      - SOKETI_DEBUG=1
      - SOKETI_DEFAULT_APP_ID=1
      - SOKETI_DEFAULT_APP_KEY=keepappkey
      - SOKETI_DEFAULT_APP_SECRET=keepappsecret

  # ---------------------------------------------------------------------------
  # Log-observability stack (opt-in). Start it with:
  #   docker compose -f docker-compose.infra.yml --profile observability up -d
  # then point the app at Fluent Bit:
  #   KEEP_FLUENTBIT=true KEEP_FLUENTBIT_HOST=localhost KEEP_FLUENTBIT_PORT=9880
  # Pipeline: app --(HTTP POST)--> fluent-bit --> elasticsearch --> kibana.
  # These services are gated behind the `observability` profile so the default
  # `up` (kafka/postgres/websocket) stays lightweight.
  # ---------------------------------------------------------------------------
  fluent-bit:
    image: fluent/fluent-bit:3.1
    profiles: ["observability"]
    ports:
      - "9880:9880"   # HTTP input — where the app POSTs log records
      - "2020:2020"   # Fluent Bit monitoring API
    volumes:
      - ./fluent-bit.dev.conf:/fluent-bit/etc/fluent-bit.conf:ro
    depends_on:
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    profiles: ["observability"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false          # local dev only — no auth
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - cluster.routing.allocation.disk.watermark.low=99%
      - cluster.routing.allocation.disk.watermark.high=99%
      - cluster.routing.allocation.disk.watermark.flood_stage=99%
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 5s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    profiles: ["observability"]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Automations trigger index: the `reload` pub/sub channel.
  #
  # The index does NOT need this to work -- an unset REDIS_URL is a quiet
  # degradation, and the reload worker still converges on its timer. Redis is
  # here so the reload integration test has something to talk to, and so local
  # convergence is sub-second like production.
  #
  # AOF everysec mirrors the durability posture of spec section 7.3.
  # Host port 6380, NOT 6379: the keepHQ root stack (CLAUDE.md's "THE local
  # infra stack for all six services") already binds 6379 as `keep-redis`, and
  # a dev with both up would get "port is already allocated". Set
  # REDIS_URL=redis://localhost:6380/0 when using this stack standalone.
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
