[tool.poetry]
name = "keep-event-handler"
version = "0.52.2.0"
description = "Event Handler service for Keep"
authors = ["Keep Authors"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.115.6"
uvicorn = "^0.32.1"
python-dotenv = "^0.21.1"
aiokafka = "^0.11.0"
arq = "^0.26.3"
pydantic = "^1.10.4"
prometheus-fastapi-instrumentator = "^7.0.0"
alembic = "*"
cel-python = "*"
chevron = "*"
click = "*"
json5 = "*"
kubernetes = "*"
lark = "*"
opentelemetry-api = "*"
opentelemetry-sdk = "*"
opentelemetry-instrumentation-fastapi = "*"
pymysql = "*"
requests = "*"
urllib3 = "*"
PyYAML = "*"
python-dateutil = "*"
opentelemetry-instrumentation-sqlalchemy = "*"
psycopg2-binary = "*"
gunicorn = "^25.0.3"
opentelemetry-exporter-otlp = "^1.25.0"
opentelemetry-instrumentation-logging = "*"
opentelemetry-instrumentation-requests = "*"
opentelemetry-semantic-conventions = "*"
sqlmodel = "0.0.8"
python-json-logger = "^2.0.7"
retry = "^0.9.2"
confluent-kafka = "^2.3.0"
pytz = "*"
cloud-sql-python-connector = "*"
google-auth = "*"
google-api-core = "*"
sqlalchemy-utils = "*"
python-multipart = "*"
ujson = "*"
pympler = "*"
elasticsearch = "*"
pusher = "*"
prometheus-client = "*"
# Automations trigger index: the `reload` pub/sub listener. Present transitively
# via arq already, but relied on directly now, so it is pinned directly.
redis = "^5.0"

[tool.poetry.group.dev.dependencies]
vulture = "^2.14"
pytest = "^7.0"
freezegun = "^1.5.5"
tenacity = "^9.1.4"
pytest-asyncio = "^0.23.0"
# The trigger index adds two daemon threads and socket-touching tests to a suite
# the Stop hook runs with no wall-clock bound. Also un-breaks the three existing
# @pytest.mark.timeout markers in tests/test_counting_integration.py, which
# pytest reports as PytestUnknownMarkWarning (i.e. silent no-ops) without this.
pytest-timeout = "^2.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# A default wall-clock bound for EVERY test, not just the ones that remembered
# a marker. The Stop hook and CI both run pytest with no timeout of their own,
# and this suite now contains daemon threads, a socket-polling loop and real
# connection probes -- any one of which can hang a run indefinitely.
# Per-test @pytest.mark.timeout still overrides this.
timeout = 120
