name: Claude Code Review

on:
  pull_request:
    branches-ignore: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude code review
    # Drafts are skipped; fork PRs are skipped because GitHub withholds secrets from them.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      id-token: write
    steps:
      # Review only once every other check on the PR head has finished and passed.
      - name: Wait for the other checks to pass
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SELF: Claude code review
        run: |
          sleep 20
          deadline=$((SECONDS + 3600))
          stable=0
          while :; do
            runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name != env.SELF) | "\(.status) \(.conclusion) \(.name)"')
            pending=$(grep -v '^completed ' <<<"$runs" || true)
            if [ -z "$pending" ]; then
              # Two quiet polls in a row, so late-starting workflows are not missed.
              stable=$((stable + 1))
              [ "$stable" -ge 2 ] && break
            else
              stable=0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning::Skipping Claude review: other checks still running after 60 minutes."
              echo "pass=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          failed=$(grep -vE '^completed (success|skipped|neutral) ' <<<"$runs" || true)
          if [ -n "$failed" ]; then
            echo "::notice::Skipping Claude review because other checks did not pass."
            echo "$failed"
            echo "pass=false" >> "$GITHUB_OUTPUT"
          else
            echo "${runs:-No other checks.}"
            echo "pass=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.checks.outputs.pass == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # Fetched here so Claude needs no gh api access and gets the whole diff, which is
      # too long for one tool result on larger PRs; kept under .git so they are not repo files.
      - name: Collect the PR diff and earlier Claude review comments
        if: steps.checks.outputs.pass == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > .git/claude-pr.diff; then
            # GitHub refuses whole-PR diffs above its size limit; fall back to per-file patches.
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[] | "diff --git a/\(.filename) b/\(.filename)\n\(.patch // "(patch too large for GitHub to show; read the file)")"' \
              > .git/claude-pr.diff
          fi
          echo "PR diff: $(wc -l < .git/claude-pr.diff) lines, $(grep -c '^diff --git' .git/claude-pr.diff) file(s)."
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | {path, line, body}' \
            > .git/claude-earlier-comments.jsonl
          echo "$(wc -l < .git/claude-earlier-comments.jsonl) earlier Claude comment(s)."
      - if: steps.checks.outputs.pass == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Max subscription token from `claude setup-token`; API keys bill Console credits instead.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Own prompt instead of the code-review plugin, which skips any PR Claude has
          # already commented on; this reviews every push and skips repeated findings.
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Review this pull request as it stands at HEAD SHA after a new push. Report only
            new, high-confidence problems that the PR introduces. The PR is checked out in the
            working directory. You can read and search files, but you cannot run code, tests,
            git or any shell command other than the gh commands below; reason from the code.

            1. Read the PR description with `gh pr view PR --repo REPO`. The complete diff is in
               .git/claude-pr.diff; read all of it with the Read tool, in chunks with offset
               and limit when it is long (do not use gh pr diff, its output gets cut off).
               Read Claude's earlier inline comments on this PR from
               .git/claude-earlier-comments.jsonl (one JSON object per line with path, line
               and body; empty when there are none).
            2. Collect the CLAUDE.md and AGENTS.md files that apply to the changed files: the
               repository root and every directory on the path to a changed file.
            3. Launch three subagents in parallel, each given the PR title and description, the
               path .git/claude-pr.diff, and the same rules on what they can and cannot run:
               - one checks the changes against those instruction files and quotes the exact
                 rule each problem breaks;
               - two independently look for bugs in the changed code: code that will not
                 parse, compile or import; logic that is wrong for every input; security
                 problems introduced by the change.
            4. Verify every candidate issue against the code at HEAD SHA with a separate
               subagent and keep it only if the subagent confirms it. Drop issues that existed
               before this PR, style and nitpicks, anything a linter or the CI checks catch,
               problems that depend on unusual inputs or state, and anything an earlier
               claude[bot] comment already raised, even if worded differently.
            5. Post each remaining issue as one inline comment with
               mcp__github_inline_comment__create_inline_comment (confirmed: true): what is
               wrong and why, citing the instruction file rule when relevant. Include a
               suggestion block only when applying it fully fixes the issue.
            6. Always finish with this step, even when the review was incomplete. Post or
               update the single summary comment, replacing its whole body:
               `gh pr comment PR --repo REPO --edit-last --create-if-none --body "<summary>"`
               where the summary is a "## Claude code review" heading followed by
               "Reviewed <first 7 characters of HEAD SHA>: <N> new issue(s), see the inline
               comments." or "Reviewed <first 7 characters of HEAD SHA>: no new issues found.",
               plus one line naming any files or parts of the diff you could not review.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
