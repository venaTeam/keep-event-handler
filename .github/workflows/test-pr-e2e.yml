name: Tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/alert_deduplicator/**"
      - "src/api/**"
      - "src/bl/**"
      - "src/config/**"
      - "src/contextmanager/**"
      - "src/controllers/**"
      - "src/core/**"
      - "src/event_management/**"
      - "src/event_subscriber/**"
      - "src/functions/**"
      - "src/identitymanager/**"
      - "src/models/**"
      - "src/parser/**"
      - "src/providers/**"
      - "src/rulesengine/**"
      - "src/secretmanager/**"
      - "src/utils/**"
      - "src/*.py"
      - "poetry.lock"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "tests/**"
  push:
    branches:
      - main
      - dev
    paths:
      - "src/alert_deduplicator/**"
      - "src/api/**"
      - "src/bl/**"
      - "src/config/**"
      - "src/contextmanager/**"
      - "src/controllers/**"
      - "src/core/**"
      - "src/event_management/**"
      - "src/event_subscriber/**"
      - "src/functions/**"
      - "src/identitymanager/**"
      - "src/models/**"
      - "src/parser/**"
      - "src/providers/**"
      - "src/rulesengine/**"
      - "src/secretmanager/**"
      - "src/utils/**"
      - "src/*.py"
      - "poetry.lock"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: 3.11

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: .venv
          key: pydeps-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies using poetry
        run: poetry install --no-interaction --no-root --with dev
      
      - name: Run Tests
        run: poetry run pytest tests/
        env:
          PYTHONPATH: .
